spring.application.name=StudentManagementSystem

# ── Database ──────────────────────────────────────────────────────────────────
# Set these via environment variables or application-local.properties (git-ignored)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/defaultdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
# MUST be overridden in production — minimum 256 bits (32 chars)
jwt.secret=${JWT_SECRET:replace-this-with-a-strong-secret-in-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.arpit.StudentManagementSystem=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha